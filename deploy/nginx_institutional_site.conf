# =====================================================================
# Vitrine institucional publica - sentinelaindustrial.com.br
#
# Este server block deve substituir qualquer config antiga que faça proxy de
# "/" para o Streamlit no dominio raiz. O app autenticado fica somente em:
#   https://app.sentinelaindustrial.com.br/
#
# Mantem as APIs de ingestao no dominio raiz para compatibilidade com gateways:
#   /grease/*    -> 127.0.0.1:8000
#   /condition/* -> 127.0.0.1:8001
#   /contact/*   -> 127.0.0.1:8002
# =====================================================================

server {
    listen 80;
    server_name sentinelaindustrial.com.br www.sentinelaindustrial.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sentinelaindustrial.com.br www.sentinelaindustrial.com.br;

    # Certbot normalmente preenche/gerencia estes caminhos.
    # Ajuste se o certificado do dominio raiz estiver em outro caminho.
    # ssl_certificate /etc/letsencrypt/live/sentinelaindustrial.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sentinelaindustrial.com.br/privkey.pem;

    root /opt/automacaoapi/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Se algum link antigo chamar /oauth2 no dominio raiz, manda para o app.
    location ^~ /oauth2/ {
        return 302 https://app.sentinelaindustrial.com.br$request_uri;
    }

    location /grease/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    location /condition/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    location /contact/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
