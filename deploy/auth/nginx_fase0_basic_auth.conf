# =====================================================================
# FASE 0 — Mitigação imediata (antes do Cognito estar pronto)
# Coloca a aplicação Streamlit atrás de autenticação básica + impede
# indexação. É temporário; será substituído por nginx_app_auth.conf.
#
# 1) Criar o arquivo de senha (uma vez), no servidor:
#      sudo apt-get install -y apache2-utils   # fornece o htpasswd
#      sudo htpasswd -c /etc/nginx/.htpasswd_sentinela admin
#      sudo htpasswd /etc/nginx/.htpasswd_sentinela operador   # usuários extras
#
# 2) Incluir este server block (ajuste server_name/porta do Streamlit) e:
#      sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

server {
    listen 443 ssl;
    server_name app.sentinelaindustrial.com.br;

    # ssl_certificate / ssl_certificate_key gerenciados pelo certbot/letsencrypt.

    # Não indexar a aplicação em buscadores.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        auth_basic           "Sentinela Industrial - acesso restrito";
        auth_basic_user_file /etc/nginx/.htpasswd_sentinela;

        proxy_pass         http://127.0.0.1:8501;   # porta padrão do Streamlit
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket do Streamlit
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# Alternativa/complemento: em vez (ou além) de auth_basic, restringir por IP:
#   location / {
#       allow 203.0.113.0/24;   # faixa da empresa/VPN
#       deny  all;
#       ...
#   }
