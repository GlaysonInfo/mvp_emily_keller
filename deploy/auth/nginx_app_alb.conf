# =====================================================================
# nginx para o modo ALB + Cognito nativo (SEM oauth2-proxy / auth_request).
# O ALB já autenticou e injeta os cabeçalhos x-amzn-oidc-*. Aqui o nginx só
# roteia por caminho e repassa esses cabeçalhos ao Streamlit. Os serviços
# permanecem em 127.0.0.1. O acesso à porta 80 vem apenas do ALB (security
# group em infra/alb).
#
#   sudo cp deploy/auth/nginx_app_alb.conf /etc/nginx/conf.d/app_sentinela.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Lembre de remover a config antiga com oauth2-proxy/auth_request.
# =====================================================================

server {
    listen 80;
    server_name _;

    # Health check do ALB (não exige autenticação).
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # APIs de ingestão (protegidas por token na própria API).
    location /grease/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }
    location /condition/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    # Dashboard Streamlit: repassa a identidade vinda do ALB.
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Identidade injetada pelo ALB (o ALB sobrescreve estes na rota
        # autenticada, então o cliente não consegue forjá-los).
        proxy_set_header X-Amzn-Oidc-Data        $http_x_amzn_oidc_data;
        proxy_set_header X-Amzn-Oidc-Identity    $http_x_amzn_oidc_identity;
        proxy_set_header X-Amzn-Oidc-Accesstoken $http_x_amzn_oidc_accesstoken;

        # WebSocket do Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
