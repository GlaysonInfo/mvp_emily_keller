# =====================================================================
# FASE 1 — nginx + oauth2-proxy (OIDC contra AWS Cognito) na frente do app
#
# O oauth2-proxy roda em 127.0.0.1:4180 e valida o token do Cognito.
# O nginx usa auth_request: cada requisição é autorizada pelo proxy antes
# de chegar ao Streamlit, e os dados de identidade são repassados ao app
# por cabeçalhos X-Forwarded-* (que o nginx SOBRESCREVE — o cliente não
# consegue forjá-los).
#
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

server {
    listen 443 ssl;
    server_name app.sentinelaindustrial.com.br;

    # ssl_certificate / ssl_certificate_key via certbot/letsencrypt.

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Endpoints do oauth2-proxy (login, callback, logout).
    location = /oauth2/sign_out {
        if ($arg_rd = "") {
            # Limpa a sessao do oauth2-proxy, encerra a sessao do Cognito
            # Hosted UI e volta para a vitrine institucional.
            return 302 /oauth2/sign_out?rd=https%3A%2F%2Fsentinela-industrial-login.auth.us-east-1.amazoncognito.com%2Flogout%3Fclient_id%3D45541b6bo4hnj6ekhvj2htfp09%26logout_uri%3Dhttps%253A%252F%252Fsentinelaindustrial.com.br%252F;
        }

        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Scheme         $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location /oauth2/ {
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Scheme         $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # Sub-request interno de autorização.
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Scheme         $scheme;
        proxy_set_header Content-Length   "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        # Se não autenticado, redireciona para o login do proxy.
        error_page 401 = /oauth2/start?rd=$request_uri;

        # Captura a identidade validada pelo proxy...
        auth_request_set $email   $upstream_http_x_auth_request_email;
        auth_request_set $user    $upstream_http_x_auth_request_user;
        auth_request_set $groups  $upstream_http_x_auth_request_groups;
        auth_request_set $tenant  $upstream_http_x_auth_request_tenant;

        # ...e a repassa ao Streamlit com nomes próprios (SOBRESCREVENDO
        # qualquer valor que o cliente tente injetar). Estes nomes batem
        # com src/dashboard/auth/identity.py.
        proxy_set_header X-Forwarded-Email  $email;
        proxy_set_header X-Forwarded-User   $user;
        proxy_set_header X-Forwarded-Groups $groups;
        proxy_set_header X-Forwarded-Tenant $tenant;

        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
