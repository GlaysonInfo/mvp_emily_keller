# =====================================================================
# FASE INTERMEDIARIA - app.sentinelaindustrial.com.br sem Cognito ainda
#
# Uso: separar o sistema no subdominio antes de ativar oauth2-proxy/Cognito.
# Depois da validacao, substitua por deploy/auth/nginx_app_auth.conf.
#
# O Streamlit e as APIs continuam ligados apenas em 127.0.0.1.
# =====================================================================

server {
    listen 80;
    server_name app.sentinelaindustrial.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.sentinelaindustrial.com.br;

    # Certbot normalmente preenche/gerencia estes caminhos:
    # ssl_certificate /etc/letsencrypt/live/app.sentinelaindustrial.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.sentinelaindustrial.com.br/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /grease/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    location /condition/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
