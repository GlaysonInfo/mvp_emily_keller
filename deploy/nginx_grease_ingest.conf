# Location snippet for the grease ingest API.
# Copy to /etc/nginx/snippets/grease_ingest_location.conf and include it
# inside the existing sentinelaindustrial.com.br server block.
location /grease/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Header interno usado pela API para allowlist de origem. O nginx
    # sobrescreve qualquer valor enviado pelo cliente.
    proxy_set_header X-Trusted-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    client_max_body_size 2m;
}
