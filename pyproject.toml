[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condition-monitoring-lab-mvp"
version = "0.1.0"
description = "MVP de bancada virtual para monitoramento de condicao com simulador OPC UA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "opcua>=0.98.13",
    "paho-mqtt>=2.0.0",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
